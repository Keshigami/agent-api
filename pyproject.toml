[project]
name = "agent-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.46.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
extend-exclude = ["common"]
line-length = 140
target-version = "py311"
